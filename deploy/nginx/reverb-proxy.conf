# Include this inside your Nginx HTTPS server {} block for the API domain
# Example: api.yourdomain.com (SSL on port 443)
#
# Ensure backend/.env has:
#   REVERB_SERVER_HOST=0.0.0.0
#   REVERB_SERVER_PORT=8080
#   REVERB_HOST=api.yourdomain.com
#   REVERB_PORT=443
#   REVERB_SCHEME=https
#
# And frontend/.env has:
#   NEXT_PUBLIC_REVERB_HOST=api.yourdomain.com
#   NEXT_PUBLIC_REVERB_PORT=443
#   NEXT_PUBLIC_REVERB_SCHEME=https

location /app {
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Scheme $scheme;
    proxy_set_header SERVER_PORT $server_port;
    proxy_set_header REMOTE_ADDR $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    proxy_pass http://127.0.0.1:8080;
}

location /apps {
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Scheme $scheme;
    proxy_set_header SERVER_PORT $server_port;
    proxy_set_header REMOTE_ADDR $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    proxy_pass http://127.0.0.1:8080;
}
